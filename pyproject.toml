[project]
name = "vol-scout"
version = "0.1.0"
description = "Does modern ML/foundation-model forecasting beat HAR-RV at equity volatility? Honest rolling-origin backtest."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "yfinance>=0.2.40",
    "arch>=6.3",
    "lightgbm>=4.5",
    "chronos-forecasting>=2.0",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
